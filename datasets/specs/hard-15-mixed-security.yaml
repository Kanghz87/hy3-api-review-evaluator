openapi: 3.1.0
info:
  title: Mixed Security API
  version: 1.0.0
  description: Synthetic API contract used only for evaluator testing.
servers:
- url: http://api.example.test
security:
- bearerAuth: []
paths:
  /accounts/{accountId}:
    delete:
      operationId: deleteAccount
      summary: Delete an account
      security: []
      parameters:
      - name: accountId
        in: path
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Item list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Item:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
