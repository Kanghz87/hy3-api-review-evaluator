name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python scripts/scan_secrets.py
      - run: python scripts/validate_dataset.py
      - run: python scripts/validate_results.py
      - run: python evaluation/run_evaluation.py
      - run: python evaluation/run_human_agreement.py --check
      - name: Require perfect controlled-tier ordering
        run: >-
          python -c "import json, pathlib;
          p=json.loads(pathlib.Path('results/preliminary-local-summary.json').read_text());
          assert p['strict_good_medium_bad_ranking_accuracy'] == 1.0"
      - run: python -m build
      - run: python scripts/verify_clean_install.py
